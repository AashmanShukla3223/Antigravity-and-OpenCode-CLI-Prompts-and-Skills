<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EmulatorJS Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #game { width: 100%; height: 100%; }
    #overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #111; color: #fff;
      gap: 20px; transition: opacity 0.4s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .icon { font-size: 48px; }
    h2 { font-size: 20px; font-weight: 700; }
    .status-text {
      font-size: 14px; color: rgba(255,255,255,0.6);
      min-height: 20px;
    }
    .bar-track {
      width: 300px; height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
      border-radius: 3px; transition: width 0.15s linear;
    }
    .pct {
      font-size: 13px; color: rgba(255,255,255,0.35);
      font-variant-numeric: tabular-nums;
    }
    .btn {
      padding: 12px 32px; border: none; border-radius: 10px;
      background: #6366f1; color: #fff; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="overlay">
    <div class="icon" id="stateIcon">⬇️</div>
    <h2 id="titleText">Loading Emulator...</h2>
    <div class="status-text" id="statusText"></div>
    <div id="progressGroup">
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="pct" id="pctText">0%</div>
    </div>
    <button class="btn" id="browseBtn" onclick="openFilePicker()" style="display:none">Browse Files</button>
  </div>

  <script>
    const CDN = 'https://cdn.emulatorjs.org';
    let knownUrls = new Set();
    let pollTimer = null;
    let fallbackTimer = null;
    let safeGuard = false;
    let gameTimer = null;

    const log = (msg, data) => console.log(`[Emu] ${msg}`, data !== undefined ? data : '');
    const err = (msg, data) => console.error(`[Emu] ❌ ${msg}`, data !== undefined ? data : '');

    const $ = id => document.getElementById(id);
    const status = $('statusText');
    const barFill = $('barFill');
    const pct = $('pctText');
    const icon = $('stateIcon');
    const title = $('titleText');
    const progressGroup = $('progressGroup');
    const browseBtn = $('browseBtn');

    log('v6 — Page loaded, system:', new URLSearchParams(window.location.search).get('system') || 'psx');
    log('crossOriginIsolated:', window.crossOriginIsolated);
    log('SharedArrayBuffer:', typeof SharedArrayBuffer);

    log('COOP check: navigator.crossOriginIsolated =', window.crossOriginIsolated);
    log('SAB check: typeof SharedArrayBuffer =', typeof SharedArrayBuffer);

    let _EJS_gameUrl = '';
    let _pendingGameUrl = null;
    Object.defineProperty(window, 'EJS_gameUrl', {
      get() {
        const val = _EJS_gameUrl;
        if (val && typeof val === 'string' && val.startsWith('blob:')) {
          log('EJS_gameUrl READ (blob, len=' + val.length + ')');
        } else {
          log('EJS_gameUrl READ:', JSON.stringify(val));
        }
        return val;
      },
      set(v) {
        const display = v ? (typeof v === 'string' ? '"' + v.slice(0, 60) + (v.length > 60 ? '..."' : '"') : typeof v) : String(v);
        log('EJS_gameUrl SET:', display);
        _EJS_gameUrl = v;
      },
      configurable: true,
      enumerable: true
    });

    function setStatus(txt) { status.textContent = txt; }

    function setProgress(pctVal) {
      const capped = Math.min(pctVal, 100);
      barFill.style.width = capped + '%';
      pct.textContent = Math.floor(capped) + '%';
      if (capped < 30) setStatus('Good Things are on your way');
      else if (capped < 65) setStatus('Just Take your Patience');
      else setStatus('Almost Ready to launch!');
    }

    function showReadyState(source) {
      if (safeGuard) return;
      log('showReadyState triggered by:', source || 'EJS_onLoad');
      safeGuard = true;
      clearInterval(pollTimer);
      clearTimeout(fallbackTimer);
      if (progressGroup) progressGroup.style.display = 'none';
      if (icon) icon.textContent = '🎮';
      if (title) title.textContent = 'Emulator Ready';
      setStatus('Select your ROM file to play');
      if (browseBtn) browseBtn.style.display = 'inline-block';
    }

    function showGameLoading() {
      log('showGameLoading');
      if (progressGroup) progressGroup.style.display = 'block';
      if (icon) icon.textContent = '⏳';
      if (title) title.textContent = 'Loading Game...';
      if (browseBtn) browseBtn.style.display = 'none';
      setProgress(80);
      let p = 80;
      gameTimer = setInterval(() => {
        p += Math.random() * 0.5;
        if (p >= 99) p = 99;
        setProgress(p);
      }, 400);
    }

    function finishUp() {
      log('finishUp - game started');
      if (gameTimer) clearInterval(gameTimer);
      setProgress(100);
      setTimeout(() => {
        const o = $('overlay');
        if (o) o.classList.add('hidden');
      }, 400);
    }

    function loadRomFromPicker(file) {
      log('loadRomFromPicker:', file.name, (file.size / 1024 / 1024).toFixed(1) + 'MB');
      const url = URL.createObjectURL(file);
      log('blob URL created:', url.slice(0, 60) + '...');
      fetch(url).then(r => {
        log('Blob fetch OK:', r.status, r.headers.get('content-type'));
      }).catch(e => {
        err('Blob fetch FAILED:', e.message);
      });
      _pendingGameUrl = url;
      if (window.EJS_emulator && window.EJS_emulator.config) {
        window.EJS_emulator.config.gameUrl = url;
        log('EJS_emulator.config.gameUrl set to blob URL');
      } else {
        log('EJS_emulator not ready yet, will retry on load');
      }
      window.EJS_gameUrl = url;
      log('Game URL set, hiding overlay and triggering start');
      showGameLoading();
      setTimeout(() => {
        log('Hiding overlay');
        const o = $('overlay');
        if (o) o.classList.add('hidden');
        setTimeout(() => {
          const btn = document.querySelector('.ejs_start_button');
          if (btn) {
            log('Triggering native start button click');
            btn.click();
          } else if (window.EJS_emulator && window.EJS_emulator.startButtonClicked) {
            log('Triggering startButtonClicked directly');
            window.EJS_emulator.startButtonClicked({pointerType: 'mouse'});
          } else {
            log('Start button not found');
          }
        }, 300);
      }, 800);
    }

    function openFilePicker() {
      log('openFilePicker');
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.iso,.cso,.chd,.bin,.cue,.img,.pkg,.zip,.7z,.rom,.pbp,.elf,.prx';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        loadRomFromPicker(file);
      };
      input.click();
    }

    function pollResources() {
      if (safeGuard) return;
      const resources = performance.getEntriesByType('resource');
      for (const r of resources) {
        if (r.name.startsWith(CDN) || r.name.includes('emulatorjs')) {
          knownUrls.add(r.name);
        }
      }
      const count = knownUrls.size;
      if (count > 0) {
        if (count <= 5) log('CDN resources discovered:', count);
        setProgress(Math.min(count * 16, 80));
      }
    }

    const system = new URLSearchParams(window.location.search).get('system') || 'psx';

    window.EJS_player = '#game';
    window.EJS_core = system;
    window.EJS_gameUrl = '';
    window.EJS_gameID = 1;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/nightly/data/';
    window.EJS_browserMode = 'mobile';
    window.EJS_oldShell = false;
    window.EJS_startOnLoaded = false;
    if (typeof SharedArrayBuffer === 'undefined' && !window.crossOriginIsolated) {
      log('SharedArrayBuffer not available — disabling threads');
      window.EJS_threads = false;
    } else {
      window.EJS_threads = true;
    }
    window.EJS_defaultOptions = { shader_enable: 'disabled' };
    window.EJS_onLoad = () => {
      log('EJS_onLoad fired');
      if (_pendingGameUrl && window.EJS_emulator && window.EJS_emulator.config) {
        window.EJS_emulator.config.gameUrl = _pendingGameUrl;
        log('Applied pending game URL to EJS_emulator.config.gameUrl');
      }
      showReadyState('EJS_onLoad');
    };
    window.EJS_onGameStart = () => { log('EJS_onGameStart fired'); finishUp(); };

    setProgress(0);
    log('Starting EmulatorJS loader for system:', system);

    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/nightly/data/loader.js';
    script.onload = () => {
      log('CDN loader.js loaded');
      pollTimer = setInterval(pollResources, 400);
      fallbackTimer = setTimeout(() => { log('Fallback timer fired'); showReadyState('fallback'); }, 60000);
    };
    script.onerror = (e) => {
      err('CDN loader.js failed:', e);
      setStatus('Failed to connect to CDN.');
      status.style.color = '#ef4444';
      setTimeout(() => showReadyState('CDN_error'), 3000);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
